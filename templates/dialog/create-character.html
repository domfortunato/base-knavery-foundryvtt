<div class="knavery-create-body">
  <div class="form-group">
    <label for="kn-create-name-{{idp}}">{{localize "KNAVERY.Name"}}</label>
    <div class="form-fields"><input type="text" id="kn-create-name-{{idp}}" name="name" placeholder="{{localize 'KNAVERY.Gen.NameHint'}}" /></div>
  </div>
  <div class="form-group">
    <label for="kn-create-level-{{idp}}">{{localize "KNAVERY.Level"}}</label>
    <div class="form-fields">
      <select id="kn-create-level-{{idp}}" name="level">
        {{#each levels}}<option value="{{this.level}}" {{#if (eq this.level ../min)}}selected{{/if}}>{{this.level}} — {{this.title}}</option>{{/each}}
      </select>
    </div>
  </div>
  {{!-- Random rolls the abilities unless this is ticked (user, 2026-11-14); Knave 1e always rolls. --}}
  {{#if placeAllowed}}
  <div class="form-group">
    <label for="kn-create-place-{{idp}}">{{localize "KNAVERY.Gen.PlacePoints"}}</label>
    <div class="form-fields"><input type="checkbox" id="kn-create-place-{{idp}}" name="place" /></div>
  </div>
  {{/if}}
</div>
