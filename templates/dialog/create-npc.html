{{!-- The Create NPC window: DialogV2 content. The three kinds are the
      dialog's own footer tiles (module/npc-generator.js). --}}
<div class="knavery-create-body">
  <div class="form-group">
    <label for="kn-npc-name-{{idp}}">{{localize "KNAVERY.Name"}}</label>
    <div class="form-fields"><input type="text" id="kn-npc-name-{{idp}}" name="name" placeholder="{{localize 'KNAVERY.Gen.NameHint'}}" /></div>
  </div>
  <fieldset class="kn-npc-options">
    <legend>{{localize "KNAVERY.Npc.Kind.monster"}}</legend>
    <div class="form-group">
      <label for="kn-npc-monster-{{idp}}">{{localize "KNAVERY.Npc.FromBestiary"}}</label>
      <div class="form-fields">
        <select id="kn-npc-monster-{{idp}}" name="monster">
          <option value="">{{localize "KNAVERY.Npc.Random"}}</option>
          {{#each monsters}}<option value="{{this.id}}">{{this.name}}</option>{{/each}}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>{{localize "KNAVERY.Npc.Hp"}}</label>
      <div class="form-fields kn-npc-hp">
        <label><input type="radio" name="hp" value="roll" checked /> {{localize "KNAVERY.Npc.HpRoll"}}</label>
        <label><input type="radio" name="hp" value="average" /> {{localize "KNAVERY.Npc.HpAverage"}}</label>
      </div>
    </div>
  </fieldset>
  <fieldset class="kn-npc-options">
    <legend>{{localize "KNAVERY.Npc.Kind.hireling"}}</legend>
    <div class="form-group">
      <label for="kn-npc-hireling-{{idp}}">{{localize "KNAVERY.Npc.Which"}}</label>
      <div class="form-fields">
        <select id="kn-npc-hireling-{{idp}}" name="hireling">
          {{#each hirelings}}<option value="{{this.key}}">{{this.label}}</option>{{/each}}
        </select>
      </div>
    </div>
  </fieldset>
  <fieldset class="kn-npc-options">
    <legend>{{localize "KNAVERY.Npc.Kind.companion"}}</legend>
    <div class="form-group">
      <label for="kn-npc-employer-{{idp}}">{{localize "KNAVERY.Npc.CompanionOf"}}</label>
      <div class="form-fields">
        <select id="kn-npc-employer-{{idp}}" name="employer">
          <option value="">{{localize "KNAVERY.Npc.NoOne"}}</option>
          {{#each party}}<option value="{{this.id}}">{{this.name}}</option>{{/each}}
        </select>
      </div>
    </div>
  </fieldset>
</div>
